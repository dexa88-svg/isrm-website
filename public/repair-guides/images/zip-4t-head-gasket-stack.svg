<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
<title id="t">Piaggio Zip 4T top end: gasket stack and head nut sequence</title>
<desc id="d">Left: order of parts from crankcase to head: base gasket, cylinder, steel head gasket, head. Right: cross-pattern tightening order 1-3-2-4 for the four head nuts.</desc>
<rect width="800" height="400" fill="#0f1419"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#f5f5f5">
<rect x="60" y="300" width="240" height="50" rx="6" fill="#242f3e" stroke="#2a3548"/><text x="180" y="331" text-anchor="middle">Crankcase</text>
<rect x="60" y="288" width="240" height="8" fill="#f5a623"/><text x="320" y="296" fill="#f5a623">Base gasket 0.4 / 0.5 mm (by measurement)</text>
<rect x="90" y="170" width="180" height="114" rx="6" fill="#004e89" stroke="#00a8cc" stroke-width="2"/><text x="180" y="232" text-anchor="middle">Cylinder + piston</text>
<rect x="90" y="160" width="180" height="8" fill="#f5a623"/><text x="290" y="168" fill="#f5a623">Head gasket: steel 0.3 mm</text>
<rect x="75" y="80" width="210" height="76" rx="8" fill="#242f3e" stroke="#00a8cc" stroke-width="2"/><text x="180" y="124" text-anchor="middle">Cylinder head</text>
<rect x="160" y="40" width="40" height="36" fill="#2a3548"/><text x="180" y="30" text-anchor="middle" fill="#a0a0a0">Head cover</text>
<text x="60" y="380" fill="#a0a0a0">Use 2 dowels at each joint. New gaskets every time.</text>
<rect x="500" y="80" width="230" height="230" rx="12" fill="#1a2332" stroke="#2a3548"/>
<circle cx="550" cy="130" r="22" fill="#ff6b35"/><text x="550" y="136" text-anchor="middle" fill="#0f1419" font-weight="bold">1</text>
<circle cx="680" cy="130" r="22" fill="#00a8cc"/><text x="680" y="136" text-anchor="middle" fill="#0f1419" font-weight="bold">2</text>
<circle cx="550" cy="260" r="22" fill="#00a8cc"/><text x="550" y="266" text-anchor="middle" fill="#0f1419" font-weight="bold">4</text>
<circle cx="680" cy="260" r="22" fill="#ff6b35"/><text x="680" y="266" text-anchor="middle" fill="#0f1419" font-weight="bold">3</text>
<line x1="572" y1="130" x2="658" y2="238" stroke="#a0a0a0" stroke-dasharray="4"/><line x1="658" y1="130" x2="572" y2="238" stroke="#a0a0a0" stroke-dasharray="4"/>
<text x="615" y="200" text-anchor="middle" fill="#a0a0a0">cross</text>
<text x="615" y="335" text-anchor="middle">6–7 Nm, then 90° + 90°</text>
<text x="615" y="358" text-anchor="middle" fill="#a0a0a0">each pass in cross order</text>
</g></svg>
